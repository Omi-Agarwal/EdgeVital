<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E2761"/>
      <stop offset="100%" style="stop-color:#E63946"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <!-- Heartbeat line -->
  <polyline points="8,34 18,34 22,20 26,44 30,28 34,38 38,34 56,34"
    stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- E and V letters -->
  <text x="14" y="58" font-family="Arial,sans-serif" font-size="10" font-weight="900"
    fill="rgba(255,255,255,0.9)" letter-spacing="1">E</text>
  <text x="44" y="58" font-family="Arial,sans-serif" font-size="10" font-weight="900"
    fill="rgba(255,255,255,0.9)" letter-spacing="1">V</text>
  <!-- Dot separator -->
  <circle cx="32" cy="55" r="2" fill="#E63946"/>
</svg>